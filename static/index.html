<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorcana Price Tracker</title>
  <meta name="description" content="Disney Lorcana card and sealed product prices from Cardmarket and TCGPlayer, with daily snapshots and market movers." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l11 14-11 14L5 16z' fill='%23d9ae5c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&f[]=zodiak@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=3" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script>
    // Same-origin by default (served by FastAPI). To use the NUC's data from
    // another machine, open with ?api=http://home-server:8000 or persist it:
    //   localStorage.setItem("lorcana_api", "http://home-server:8000")
    (function () {
      var q = new URLSearchParams(location.search).get("api");
      window.API_BASE = (q || localStorage.getItem("lorcana_api") || "").replace(/\/$/, "");
      if (window.API_BASE.startsWith("__")) window.API_BASE = "http://localhost:8000";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Lorcana Price Tracker home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l11 14-11 14L5 16z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 9l5.5 7L16 23l-5.5-7z" fill="currentColor"/></svg>
      <span class="brand-text">Lorcana <em>Price Tracker</em></span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-nav="cards" class="tab">Cards</a>
      <a href="#/market" data-nav="market" class="tab">Market</a>
      <a href="#/sealed" data-nav="sealed" class="tab">Sealed</a>
    </nav>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search any card…" autocomplete="off" aria-label="Search cards" />
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
    <div class="status-pill" id="status-pill" title="Data status">Loading…</div>
  </header>

  <main id="content" class="content" tabindex="-1"></main>

  <footer class="footer">
    <span>Prices: <a href="https://www.cardmarket.com/en/Lorcana" target="_blank" rel="noopener">Cardmarket</a> public price guide (EUR) · TCGPlayer market via <a href="https://lorcast.com" target="_blank" rel="noopener">Lorcast</a> (converted to EUR). Snapshotted daily. Reference only.</span>
    <span>Rebuilt from <a href="https://github.com/oconnell-carl/lorcana-tracker" target="_blank" rel="noopener">oconnell-carl/lorcana-tracker</a></span>
  </footer>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
